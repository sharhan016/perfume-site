name: Verify and deploy ORYNOVA to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orynova-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Validate production Compose file
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build and smoke-test production image
        run: |
          docker build --tag orynova:ci .
          docker run --detach --name orynova-ci --publish 127.0.0.1:3000:3000 orynova:ci
          trap 'docker rm --force orynova-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs orynova-ci
          exit 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy Compose project through Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ secrets.HOSTINGER_VM_ID }}
          project-name: orynova
          docker-compose-path: docker-compose.production.yml
